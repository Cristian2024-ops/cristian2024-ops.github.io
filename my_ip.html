<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Información de mi Dispositivo e IP</title>
    <!-- 
      ======================================================
      🤖 CÓDIGO GENERADO TOTALMENTE CON INTELIGENCIA ARTIFICIAL (IA)
      ======================================================
    -->
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            width: 100%;
            position: relative;
        }
        h1 {
            color: #333;
            font-size: 20px;
            margin-bottom: 5px;
            margin-top: 20px;
        }
        h1:first-child {
            margin-top: 0;
        }
        .info-box {
            font-size: 24px;
            font-weight: bold;
            color: #007bff;
            background: #e7f3ff;
            padding: 12px;
            border-radius: 8px;
            word-break: break-all;
            margin-top: 8px;
            margin-bottom: 8px;
        }
        .battery-box {
            color: #28a745;
            background: #e8f5e9;
        }
        .loading {
            color: #666;
            font-style: italic;
            font-size: 18px;
        }
        .status-text {
            font-size: 14px;
            color: #555;
            font-weight: normal;
            margin-top: 5px;
        }
        .details-list {
            text-align: left;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }
        .detail-item {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #495057;
            padding: 8px 0;
            border-bottom: 1px solid #dee2e6;
        }
        .detail-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        .detail-item:first-child {
            padding-top: 0;
        }
        .detail-label {
            font-weight: 600;
            color: #6c757d;
        }
        .detail-value {
            font-weight: bold;
            text-align: right;
            max-width: 65%;
            word-break: break-word;
        }
        /* Estilos para el distintivo visual de IA */
        .ai-badge {
            margin-top: 25px;
            font-size: 12px;
            color: #a0aec0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Tu Dirección IP Pública:</h1>
        <div id="ip" class="info-box loading">Cargando IP...</div>

        <h1>Estado de tu Batería:</h1>
        <div id="battery-container" class="info-box battery-box loading">
            <span id="battery-level">Cargando...</span>
            <div id="battery-status" class="status-text"></div>
        </div>

        <h1>Detalles del Dispositivo:</h1>
        <div class="details-list">
            <div class="detail-item">
                <span class="detail-label">Navegador / SO:</span>
                <span id="detail-os" class="detail-value">Detectando...</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Resolución:</span>
                <span id="detail-resolution" class="detail-value">Detectando...</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Hora Local:</span>
                <span id="detail-time" class="detail-value">Detectando...</span>
            </div>
        </div>

        <!-- Crédito visible en la interfaz de la página -->
        <div class="ai-badge">
            <span>🤖</span> <span>Código desarrollado de manera inteligente por IA</span>
        </div>
    </div>

    <script>
        /* 
         * LÓGICA JAVASCRIPT - CREADA POR ASISTENTE DE IA
         */

        // --- 1. OBTENER LA DIRECCIÓN IP ---
        fetch('https://ipify.org')
            .then(response => {
                if (!response.ok) throw new Error('Error de red');
                return response.text();
            })
            .then(ip => {
                const ipElement = document.getElementById('ip');
                ipElement.innerText = ip;
                ipElement.classList.remove('loading');
            })
            .catch(error => {
                console.error('Error al obtener la IP:', error);
                const ipElement = document.getElementById('ip');
                ipElement.innerText = 'No se pudo cargar la IP';
                ipElement.style.color = '#dc3545';
                ipElement.classList.remove('loading');
            });

        // --- 2. OBTENER EL ESTADO DE LA BATERÍA ---
        if ('getBattery' in navigator) {
            navigator.getBattery().then(function(battery) {
                const containerElement = document.getElementById('battery-container');
                const levelElement = document.getElementById('battery-level');
                const statusElement = document.getElementById('battery-status');

                containerElement.classList.remove('loading');

                function actualizarTodoElEstado() {
                    const nivel = Math.round(battery.level * 100);
                    levelElement.innerText = nivel + '%';

                    if (battery.charging) {
                        statusElement.innerText = '🔌 Conectado a la corriente (Cargando)';
                        containerElement.style.color = '#007bff';
                        containerElement.style.background = '#e7f3ff';
                    } else {
                        statusElement.innerText = '🔋 Descargando';
                        containerElement.style.color = '#28a745';
                        containerElement.style.background = '#e8f5e9';
                    }
                }

                actualizarTodoElEstado();
                battery.addEventListener('levelchange', actualizarTodoElEstado);
                battery.addEventListener('chargingchange', actualizarTodoElEstado);
            });
        } else {
            const containerElement = document.getElementById('battery-container');
            document.getElementById('battery-level').innerText = 'No disponible';
            document.getElementById('battery-status').innerText = 'Tu navegador limita el acceso a la batería';
            containerElement.style.color = '#6c757d';
            containerElement.style.background = '#f8f9fa';
            containerElement.classList.remove('loading');
        }

        // --- 3. DETECTAR NAVEGADOR Y SISTEMA OPERATIVO BÁSICO ---
        function obtenerPlataforma() {
            const userAgent = navigator.userAgent;
            let os = "Desconocido";
            let browser = "Desconocido";

            if (userAgent.indexOf("Win") != -1) os = "Windows";
            else if (userAgent.indexOf("Mac") != -1) os = "MacOS / iOS";
            else if (userAgent.indexOf("Android") != -1) os = "Android";
            else if (userAgent.indexOf("Linux") != -1) os = "Linux";

            if (userAgent.indexOf("Chrome") != -1 && userAgent.indexOf("Edge") == -1 && userAgent.indexOf("Edg") == -1) browser = "Chrome";
            else if (userAgent.indexOf("Safari") != -1 && userAgent.indexOf("Chrome") == -1) browser = "Safari";
            else if (userAgent.indexOf("Firefox") != -1) browser = "Firefox";
            else if (userAgent.indexOf("Edge") != -1 || userAgent.indexOf("Edg") != -1) browser = "Edge";

            return `${browser} (${os})`;
        }
        document.getElementById('detail-os').innerText = obtenerPlataforma();

        // --- 4. DETECTAR RESOLUCIÓN DE PANTALLA ---
        const ancho = window.screen.width;
        const alto = window.screen.height;
        document.getElementById('detail-resolution').innerText = `${ancho} x ${alto} px`;

        // --- 5. DETECTAR HORA LOCAL ---
        function actualizarHora() {
            const ahora = new Date();
            const horaFormateada = ahora.toLocaleTimeString(navigator.language, {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
            document.getElementById('detail-time').innerText = horaFormateada;
        }
        actualizarHora();
        setInterval(actualizarHora, 1000);
    </script>

</body>
</html>
